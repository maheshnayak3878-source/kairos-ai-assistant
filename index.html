<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairos AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #151b2b;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #aab3c5;
      margin: 8px 0 25px;
    }

    .chat {
      background: #0d1320;
      border-radius: 16px;
      padding: 15px;
      min-height: 180px;
      margin-bottom: 15px;
    }

    .message {
      background: #20283a;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .input-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      outline: none;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      background: #6c5ce7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">🤖</div>

    <h1>Kairos</h1>

    <p class="subtitle">
      आपका Personal AI Assistant
    </p>

    <div class="chat" id="chat">
      <div class="message">
        👋 नमस्ते! मैं Kairos हूँ। मैं आपके काम को automate करने के लिए तैयार हूँ।
      </div>
    </div>

    <div class="input-box">
      <input
        type="text"
        id="userInput"
        placeholder="Kairos को कुछ बताइए..."
      >

      <button onclick="sendMessage()">
        भेजें
      </button>
    </div>

  </div>

  <script>

    function sendMessage() {

      const input = document.getElementById("userInput");
      const chat = document.getElementById("chat");

      const text = input.value.trim();

      if (!text) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message";
      userMessage.innerHTML = "👤 " + text;

      chat.appendChild(userMessage);

      const aiMessage = document.createElement("div");
      aiMessage.className = "message";
      aiMessage.innerHTML =
        "🤖 Kairos: आपका आदेश मिल गया। AI connection हम अगले step में जोड़ेंगे।";

      chat.appendChild(aiMessage);

      input.value = "";

      chat.scrollTop = chat.scrollHeight;
    }

  </script>

</body>
</html>
